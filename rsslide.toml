# Project-local rsslide configuration. Auto-discovered by rsslide when run
# from this directory. Every section is optional — only override what you
# want to differ from the built-in defaults, which reproduce marp's
# `default` theme (including its 960 x 540 pt slide size).
#
# Run `rsslide dump-config` to see the full annotated defaults.

[svg]
# Let the SVG extend to the slide's side edges and almost to its bottom so
# the diagram dominates the page (marp would keep it inside the padding).
margin_x_ratio = 0.0
margin_bottom_ratio = 0.005
