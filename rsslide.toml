# Project-local rsslide configuration. Auto-discovered by rsslide when run
# from this directory. Every section is optional — only override what you
# want to differ from the built-in defaults, which reproduce marp's
# `default` theme (including its 960 x 540 pt slide size).
#
# Run `rsslide dump-config` to see the full annotated defaults.

[svg]
# Let the SVG fill the height left under the title, out to the slide's side
# edges and almost to its bottom, so the diagram dominates the page (marp
# sizes it to the content width instead, which is the default).
size = "fill"
margin_x_ratio = 0.0
margin_bottom_ratio = 0.005

[credit]
# Who compiles this repository's decks, named on each deck's first slide.
# Set here rather than taken from git, which CI's runner has no identity in.
name = "Mark Veltzer"
email = "mark.veltzer@gmail.com"
