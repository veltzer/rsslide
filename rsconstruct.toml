[processor.generator.generic.generate1]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["yaml"]
src_extensions = [".yaml"]
output_dir = "out/generate1"
output_extension = "pdf"
batch = true

[processor.generator.generic.generate2]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["out/import"]
src_extensions = [".yaml"]
output_dir = "out/generate2"
output_extension = "pdf"
batch = true

[processor.generator.generic.import]
command = "rsslide"
args = ["import"]
src_dirs = ["marp"]
src_extensions = [".md"]
output_dir = "out/import"
output_extension = "yaml"
batch = true

[processor.checker.yamllint]
src_dirs = ["out/import","yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── dependencies ────────────────────────────────────────────────────────────

# The crates every rs* repo's build and release run, installed with
# `rsconstruct tool install-deps` (cargo install --locked, by crate name).
# cargo-deny and cargo-nextest are what the shared ci.yml runs, mdbook builds
# docs/, and cargo-release reads release.toml. rustfmt and clippy are rustup
# components, not crates, so they are absent. This block is byte-identical
# across all rs* repos: change it everywhere or nowhere.
[dependencies]
cargo = ["cargo-deny", "cargo-nextest", "cargo-release", "mdbook"]
