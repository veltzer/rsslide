[processor.generator.generate1]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["yaml"]
src_extensions = [".yaml"]
output_dir = "out/generate1"
output_extension = "pdf"
batch = true

[processor.generator.generate2]
command = "rsslide"
args = ["generate", "--format=pdf"]
src_dirs = ["out/import"]
src_extensions = [".yaml"]
output_dir = "out/generate2"
output_extension = "pdf"
batch = true

[processor.generator.import]
command = "rsslide"
args = ["import"]
src_dirs = ["marp"]
src_extensions = [".md"]
output_dir = "out/import"
output_extension = "yaml"
batch = true

[processor.yamllint]
src_dirs = ["out/import","yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
