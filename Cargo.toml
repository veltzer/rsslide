[package]
name = "rsslide"
version = "0.1.16"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "The ultimate slide builder"
license = "MIT"
repository = "https://github.com/veltzer/rsslide"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
krilla = "0.8"
krilla-svg = "0.8"
# usvg also provides the font database (`usvg::fontdb`): the one handed to
# usvg must be its own fontdb version, so there is no separate dependency
# on fontdb to drift out of step with it.
usvg = "0.47"
# Text measurement. Must be the rustybuzz krilla shapes with, so measured
# widths equal drawn widths: move it together with krilla.
rustybuzz = "0.20"
syntect = { version = "5", default-features = false, features = ["default-themes", "html", "plist-load", "regex-fancy"] }
# bat's syntax collection, a superset of syntect's defaults. Its regex
# engine must be syntect's: fancy-regex.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
anyhow = "1"
toml = "1"
dirs = "7"
# The HTML5 named character references, for `&name;` in text.
htmlize = { version = "1", features = ["entities"] }

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
