[package]
name = "rsslide"
version = "0.1.6"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "The ultimate slide builder"
license = "MIT"
repository = "https://github.com/veltzer/rsslide"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
krilla = "0.8"
krilla-svg = "0.8"
usvg = "0.47"
fontdb = "0.23"
tera = "1"
zip = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
anyhow = "1"
toml = "1.1"
dirs = "5"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
