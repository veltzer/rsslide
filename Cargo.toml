[package]
name = "rsslide"
version = "0.1.31"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "The ultimate slide builder"
license = "MIT"
repository = "https://github.com/veltzer/rsslide"
keywords = ["slides", "presentation", "pdf", "marp"]
categories = ["visualization", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
krilla = "0.8"
krilla-svg = "0.8"
# usvg also provides the font database (`usvg::fontdb`): the one handed to
# usvg must be its own fontdb version, so there is no separate dependency
# on fontdb to drift out of step with it.
usvg = "0.47"
# Text measurement. Must be the rustybuzz krilla shapes with, so measured
# widths equal drawn widths: move it together with krilla.
rustybuzz = "0.20"
syntect = { version = "5", default-features = false, features = ["default-themes", "html", "plist-load", "regex-fancy"] }
# bat's syntax collection, a superset of syntect's defaults. Its regex
# engine must be syntect's: fancy-regex.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
anyhow = "1"
toml = "1"
dirs = "7"
# The HTML5 named character references, for `&name;` in text.
htmlize = { version = "1", features = ["entities"] }
# The local date the credit line names (`credit.rs`).
jiff = "0.2"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# The fleet's lint table, the same in every rs* crate. rustc's own warnings
# are errors in every build, not only in the gate. clippy's default lints are
# errors too, and its pedantic and nursery groups are on: the gate runs
# clippy with -D warnings, so each of those fails the build as well.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# clippy's cargo group, lint by lint: the manifest's metadata, features and
# dependencies. multiple_crate_versions is not among them: every duplicate
# comes from upstream (deny.toml, where it is a warning, says the same).
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# clippy restriction lints, named one by one: leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
